name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # News + recovery snapshots only. Live charts do not depend on this schedule.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      data_outcome: ${{ steps.data.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch market data and news feeds
        id: data
        continue-on-error: true
        run: npm run fetch:data

      - name: Check market-data behavior
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report degraded snapshot refresh
        if: needs.build.outputs.data_outcome == 'failure'
        run: |
          echo '::error::Site deployed with available data, but a snapshot refresh failed. Inspect the data-fetch step; live charts still refresh independently.'
          exit 1
